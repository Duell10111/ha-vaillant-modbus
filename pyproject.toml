[project]
name = "ha-vaillant-modbus"
version = "0.1.0"
description = "Home Assistant custom integration for Vaillant Gateway eBUS/Modbus SV2"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
  "homeassistant>=2026.7.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-homeassistant-custom-component>=0.13.300",
  "pymodbus==3.13.1",
  "ruff>=0.12"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
